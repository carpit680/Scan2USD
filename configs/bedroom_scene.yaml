name: bedroom
video_path: /home/arpit/Scan2USD/workspace_bedroom/uploads/bedroom_scene.MOV
workspace_dir: workspace_bedroom
process_data:
  num_downscales: 2
classes:
- bed
- pillow
- chair
- table
- lamp
- book
- door
- mirror
yolo_model: yolov8n.pt
seed: 42
capture:
  modality: rgb
  depth_dir: null
  lidar_path: null
  calibration_path: null
  clean_plate_dir: null
  object_capture_dirs: {}
  scale_anchor_m: null
reconstruction:
  visual_backend: 3dgrut
  rgbd_geometry_backend: nvblox
  rgb_geometry_backend: splat
  min_registration_rate: 0.7
  blur_threshold: 0
  min_frame_features: 300
  frame_max_dim: 0
  grut_downscale: 1
  grut_config: apps/colmap_3dgut.yaml
  grut_max_iterations: 50000
  held_out_ratio: 0.1
  preview_allow_unobserved_background: false
  grut_overrides:
  - loss.lambda_ssim=0.25
  - model.progressive_training.increase_frequency=500
  usd_splat_format: standard
  splat_cleanup:
    enabled: true
    outlier_std: 8
    min_opacity: 0.01
    max_scale: null
    max_scale_frac: 0.08
    crop_margin: 0.25
    min_neighbors: 0
    max_needle_ratio: null
    min_view_count: 0
    free_space_votes: 3
    air_min_neighbors: 0
    air_neighbor_radius_frac: 0.01
    free_behind: true
    hull_air: true
  grut_schedule_autofix: true
  densify_end_fraction: 0.5
  anti_fog:
    enabled: false
    lambda_opacity: 0.0005
    prune_weight_threshold: 0.0
    prune_weight_frequency: 100
    prune_weight_start_fraction: 0.2
segmentation:
  proposal_model: yolov8s-worldv2.pt
  mask_model: sam2
  min_views_per_object: 3
  review_required: true
  allow_no_objects: true
geometry:
  voxel_size_m: 0.02
  target_static_triangles: 500000
  target_object_triangles: 100000
  simplify_ratio: 0.35
  rgb_only_requires_scale: true
  max_points_below_floor: 0.1
  min_floor_inlier_ratio: 0.02
materials:
  texture_resolution: 4096
  author_baked_variant: true
  author_pbr_variant: true
  estimate_lighting: true
  hdr_path: null
physics:
  default_density_kg_m3: 700
  default_friction: 0.5
  default_restitution: 0.05
  dynamic_collider: convexDecomposition
  vhacd_max_hulls: 32
  vhacd_resolution: 100000
usd:
  root_filename: bedroom.usd
  isaac_version: '6.0'
  meters_per_unit: 1
  up_axis: Z
  default_look: pbr
  render_mode: hybrid
  binary_mesh_layers: false
qa:
  required: true
  min_background_coverage: 0.9
  allow_background_holes: true
  max_registration_error_m: 0.03
  max_depth_error_m: 0.05
  min_texture_coverage: 0.9
  max_dynamic_collider_faces: 20000
  require_held_out_renders: true
  require_isaac_validation: true
tuning:
  max_cheap_trials: 6
  max_retrain_trials: 0
  lpips: true
  cheap_params:
    outlier_std:
    - 6.0
    - 8.0
    free_space_votes:
    - 0
    - 3
    - 10
    crop_margin:
    - 0.25
    - 0.5
  fog_weight: 1.0
external:
  colmap: /home/arpit/Scan2USD/workspace/colmap-cuda/bin/colmap
  ns_process_data: ns-process-data
  ns_train: ns-train
  ns_render: ns-render
  grut_python: /home/arpit/Scan2USD/workspace/external/3dgrut/.venv/bin/python
  grut_root: /home/arpit/Scan2USD/workspace/external/3dgrut
  nvblox: nvblox
  openmvs_interface: /home/arpit/Scan2USD/workspace/bin/InterfaceCOLMAP
  openmvs_densify: /home/arpit/Scan2USD/workspace/bin/DensifyPointCloud
  openmvs_reconstruct: /home/arpit/Scan2USD/workspace/bin/ReconstructMesh
  openmvs_refine: /home/arpit/Scan2USD/workspace/bin/RefineMesh
  openmvs_texture: TextureMesh
  sam2_runner: /home/arpit/Scan2USD/.venv/bin/python /home/arpit/Scan2USD/tools/segmentation/sam2_runner.py
    --max-objects 15 --batch-size 2
  object_reconstruction_runner: /home/arpit/Scan2USD/.venv/bin/python /home/arpit/Scan2USD/tools/geometry/masked_object_recon.py
  isaac_python: /home/arpit/Scan2USD/workspace/isaac_env/bin/python
